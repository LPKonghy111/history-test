<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测测你像哪个历史人物 · 荣格八维·MBTI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      color: #e9eef3;
    }

    .app {
      max-width: 900px;
      width: 100%;
      background: rgba(18, 24, 33, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 3.5rem;
      padding: 2rem 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 100, 0.15);
      transition: all 0.2s;
    }

    /* 进度区域 */
    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2.2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      font-weight: 500;
      color: #c0b7a8;
      text-transform: uppercase;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #262d3a;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px #00000055;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f5e56b, #c9a227);
      border-radius: 20px;
      box-shadow: 0 0 10px #f5e56b;
      transition: width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* 题目卡片 */
    .question-container {
      margin-bottom: 2rem;
    }

    .question-text {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 2rem;
      text-shadow: 0 2px 5px #00000040;
      color: #f5f1e8;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-btn {
      background: #1e2532;
      border: 1.5px solid #384252;
      border-radius: 2.5rem;
      padding: 1.2rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #dfe6f0;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px #00000030;
      letter-spacing: 0.2px;
      backdrop-filter: blur(4px);
    }

    .option-btn:hover {
      background: #2d3748;
      border-color: #d4af37;
      transform: translateY(-2px);
      box-shadow: 0 12px 20px #00000055, 0 0 0 1px #d4af37aa;
    }

    .option-btn.selected {
      background: #2e3b2e;
      border-color: #b89b3c;
      box-shadow: 0 0 0 2px #d4af37, 0 10px 20px #00000050;
      color: #fff8e0;
    }

    /* 结果区域 */
    .result-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fade 0.5s ease;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #c9b07b;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .result-mbti {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e9d7a5;
      background: #1e1e1e60;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      letter-spacing: 2px;
      margin-bottom: 0.8rem;
      border: 1px solid #d4af3750;
    }

    .result-name {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f8e7b4, #d4af37, #b8942e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.8rem;
      line-height: 1.2;
      text-shadow: 0 0 20px #d4af3740;
    }

    .result-desc {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #cbd5e1;
      text-align: left;
      margin: 1.8rem 0 2rem;
      padding: 1.8rem;
      background: #0f131cb0;
      border-radius: 2rem;
      border-left: 6px solid #d4af37;
      border-right: 1px solid #d4af3720;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: inset 0 0 30px #00000030;
    }

    .result-desc p {
      margin-bottom: 1.2rem;
    }

    .result-desc p:last-child {
      margin-bottom: 0;
    }

    .result-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .reset-btn {
      background: transparent;
      border: 1.5px solid #d4af37;
      color: #d4af37;
      padding: 0.9rem 2.5rem;
      border-radius: 3rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .reset-btn:hover {
      background: #d4af37;
      color: #0b0e14;
      box-shadow: 0 0 25px #d4af37aa;
    }

    /* 隐藏类 */
    .hidden {
      display: none !important;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .app {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem;
      }
      .question-text {
        font-size: 1.3rem;
      }
      .option-btn {
        padding: 1rem 1.2rem;
        font-size: 1rem;
      }
      .result-name {
        font-size: 2rem;
      }
      .result-desc {
        padding: 1.2rem;
        font-size: 0.95rem;
      }
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1f2c;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }
  </style>
</head>

  <!-- 题目区 -->
  <div id="quizSection">

  <div class="result-container" id="resultSection">

    <div class="result-actions">
      <button class="reset-btn" id="resetBtn">重新测试</button>
    </div>
  </div>
</div>
