<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测测你像哪个历史人物 · 荣格八维·MBTI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(145deg, #0b0e14 0%, #1a1f2c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      color: #e9eef3;
    }

    .app {
      max-width: 900px;
      width: 100%;
      background: rgba(18, 24, 33, 0.85);
      backdrop-filter: blur(16px);
      border-radius: 3.5rem;
      padding: 2rem 2.5rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 100, 0.15);
      transition: all 0.2s;
    }

    /* 进度区域 */
    .progress-area {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 2.2rem;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      font-weight: 500;
      color: #c0b7a8;
      text-transform: uppercase;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #262d3a;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 4px #00000055;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #d4af37, #f5e56b, #c9a227);
      border-radius: 20px;
      box-shadow: 0 0 10px #f5e56b;
      transition: width 0.35s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* 题目卡片 */
    .question-container {
      margin-bottom: 2rem;
    }

    .question-text {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 2rem;
      text-shadow: 0 2px 5px #00000040;
      color: #f5f1e8;
      min-height: 4.5rem;
      display: flex;
      align-items: center;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-btn {
      background: #1e2532;
      border: 1.5px solid #384252;
      border-radius: 2.5rem;
      padding: 1.2rem 1.8rem;
      font-size: 1.1rem;
      font-weight: 500;
      color: #dfe6f0;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 6px 12px #00000030;
      letter-spacing: 0.2px;
      backdrop-filter: blur(4px);
    }

    .option-btn:hover {
      background: #2d3748;
      border-color: #d4af37;
      transform: translateY(-2px);
      box-shadow: 0 12px 20px #00000055, 0 0 0 1px #d4af37aa;
    }

    .option-btn.selected {
      background: #2e3b2e;
      border-color: #b89b3c;
      box-shadow: 0 0 0 2px #d4af37, 0 10px 20px #00000050;
      color: #fff8e0;
    }

    /* 结果区域 */
    .result-container {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: fade 0.5s ease;
    }

    @keyframes fade {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-title {
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #c9b07b;
      font-weight: 400;
      margin-bottom: 0.5rem;
    }

    .result-mbti {
      font-size: 1.4rem;
      font-weight: 700;
      color: #e9d7a5;
      background: #1e1e1e60;
      padding: 0.3rem 1.5rem;
      border-radius: 40px;
      letter-spacing: 2px;
      margin-bottom: 0.8rem;
      border: 1px solid #d4af3750;
    }

    .result-name {
      font-size: 3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #f8e7b4, #d4af37, #b8942e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.8rem;
      line-height: 1.2;
      text-shadow: 0 0 20px #d4af3740;
    }

    .result-desc {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #cbd5e1;
      text-align: left;
      margin: 1.8rem 0 2rem;
      padding: 1.8rem;
      background: #0f131cb0;
      border-radius: 2rem;
      border-left: 6px solid #d4af37;
      border-right: 1px solid #d4af3720;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: inset 0 0 30px #00000030;
    }

    .result-desc p {
      margin-bottom: 1.2rem;
    }

    .result-desc p:last-child {
      margin-bottom: 0;
    }

    .result-actions {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.8rem;
    }

    .reset-btn {
      background: transparent;
      border: 1.5px solid #d4af37;
      color: #d4af37;
      padding: 0.9rem 2.5rem;
      border-radius: 3rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .reset-btn:hover {
      background: #d4af37;
      color: #0b0e14;
      box-shadow: 0 0 25px #d4af37aa;
    }

    /* 隐藏类 */
    .hidden {
      display: none !important;
    }

    /* 响应式 */
    @media (max-width: 600px) {
      .app {
        padding: 1.8rem 1.2rem;
        border-radius: 2rem;
      }
      .question-text {
        font-size: 1.3rem;
      }
      .option-btn {
        padding: 1rem 1.2rem;
        font-size: 1rem;
      }
      .result-name {
        font-size: 2rem;
      }
      .result-desc {
        padding: 1.2rem;
        font-size: 0.95rem;
      }
    }

    /* 滚动条 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1a1f2c;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #d4af37;
      border-radius: 10px;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- 进度条区域 -->
  <div class="progress-area" id="progressArea">
    <div class="progress-header">
      <span>题目进度</span>
      <span id="progressText">0 / 48</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <!-- 题目区 -->
  <div id="quizSection">
    <div class="question-container">
      <div class="question-text" id="questionText">加载中...</div>
      <div class="options" id="optionsContainer"></div>
    </div>
  </div>

  <!-- 结果区 -->
  <div class="result-container" id="resultSection">
    <div class="result-title">你的历史镜像</div>
    <div class="result-mbti" id="resultMbti">INTJ</div>
    <div class="result-name" id="resultName">诸葛亮</div>

    <div class="result-actions">
      <button class="reset-btn" id="resetBtn">重新测试</button>
    </div>
  </div>
</div>
<script>
  (function() {
    // ---------- 48道题目 (结合荣格八维与MBTI倾向) ----------
    const questions = [
      { text: "在团队中，你更倾向于：", options: ["规划长期战略，设定目标", "协调人际关系，鼓舞士气"], dimension: "EI", weight: { E: 0, I: 1, S: 0, N: 1, T: 1, F: 0, J: 1, P: 0 } },
      { text: "当面对新项目时，你首先：", options: ["分析逻辑和潜在风险", "考虑相关人员的感受和需求"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 1, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更享受哪种活动？", options: ["独自阅读或研究", "与朋友聚会交流"], dimension: "EI", weight: { E: 0, I: 1, S: 0, N: 1, T: 0, F: 0, J: 0, P: 1 } },
      { text: "在做决定时，你更依赖：", options: ["客观数据和逻辑", "内心价值观和共情"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更倾向于：", options: ["活在当下，享受实际体验", "憧憬未来，想象各种可能"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "面对压力，你通常：", options: ["制定计划，按部就班解决", "保持灵活，随机应变"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更容易注意到：", options: ["具体的细节和事实", "宏观的模式和隐喻"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "在社交场合，你通常：", options: ["主动介绍自己，融入对话", "等待别人来搭话，先观察"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你认为更重要的是：", options: ["公正和一致性", "和谐与宽容"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更喜欢的做事方式是：", options: ["提前计划，按时完成", "保持开放，随性发挥"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更容易被哪种人吸引？", options: ["有远见和创意的人", "务实和脚踏实地的人"], dimension: "SN", weight: { E: 0, I: 0, S: 0, N: 1, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更常：", options: ["表达自己的想法", "把想法留在心里"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "当朋友遇到困难，你通常：", options: ["提供解决方案和建议", "给予情感支持和倾听"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更倾向于相信：", options: ["经验与已验证的方法", "直觉与灵感"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你的工作空间通常是：", options: ["整洁有序，井井有条", "充满创意，有些杂乱"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "在聚会中，你：", options: ["认识很多新朋友，活力四射", "和少数熟悉的人深入交谈"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更看重：", options: ["能力与效率", "仁慈与同理心"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更喜欢阅读：", options: ["实用指南或历史纪实", "科幻小说或哲学随笔"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更倾向于：", options: ["先完成工作再娱乐", "边玩边做，灵活安排"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你通常：", options: ["主动发起活动", "等待他人邀请"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你认为自己更：", options: ["理性客观", "感性同情"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更容易记住：", options: ["具体的事件和数字", "整体的印象和感觉"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更愿意：", options: ["按计划表行事", "顺其自然，随遇而安"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "在会议上，你：", options: ["踊跃发言，主导讨论", "倾听为主，深思熟虑"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你更欣赏：", options: ["逻辑严谨的论证", "温暖人心的故事"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更倾向于：", options: ["关注现实与可行性", "关注未来与可能性"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你的生活方式更偏向：", options: ["规律和稳定", "灵活和即兴"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更喜欢：", options: ["成为众人焦点", "在幕后支持"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "做决策时，你更看重：", options: ["事实与证据", "人情与关系"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更容易被：", options: ["具体的奖励激励", "精神上的满足激励"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更倾向于：", options: ["提前完成任务", "在截止日期前冲刺"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你通常：", options: ["喜欢结识新朋友", "珍视老朋友"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你更认同：", options: ["真理高于一切", "爱能战胜一切"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更擅长：", options: ["处理具体事务", "构思抽象概念"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更喜欢：", options: ["确定性和可预测性", "惊喜和意外"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "在讨论中，你：", options: ["喜欢直接表达观点", "喜欢先思考再发言"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你更注重：", options: ["效率和结果", "感受和过程"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更可能：", options: ["信任经验", "信任直觉"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你的工作风格：", options: ["有条不紊，按部就班", "灵活多变，随性而为"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更愿意：", options: ["领导团队", "独自研究"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你认为自己更：", options: ["头脑冷静", "热心肠"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更关注：", options: ["现在的情况", "未来的发展"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更偏向：", options: ["计划性", "自发性"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你更容易：", options: ["主动与人交谈", "保持沉默观察"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } },
      { text: "你更看重：", options: ["公平正义", "同理关怀"], dimension: "TF", weight: { E: 0, I: 0, S: 0, N: 0, T: 1, F: 0, J: 1, P: 0 } },
      { text: "你更喜欢：", options: ["具体的操作", "抽象的理论"], dimension: "SN", weight: { E: 0, I: 0, S: 1, N: 0, T: 0, F: 0, J: 0, P: 1 } },
      { text: "你更倾向于：", options: ["提前做好安排", "到时候再说"], dimension: "JP", weight: { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 1, P: 0 } },
      { text: "你通常：", options: ["精力充沛，喜欢热闹", "安静内敛，享受独处"], dimension: "EI", weight: { E: 1, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 } }
    ];

    // ---------- 32个历史人物 (对应32种MBTI+荣格八维特质) ----------
    const characters = [
      // NT 理性者 (8)
      { name: "诸葛亮", mbti: "INTJ", desc: "荣格八维：Ni-Te-Fi-Se。你拥有深邃的洞察力与战略远见，善于在混沌中构建秩序。如同卧龙先生，你习惯先观察全局，再以严谨的逻辑制定长远规划。独立、冷静，对目标有近乎偏执的坚持。但内心深处藏着对理想社会的热忱（Fi），只是不轻易示人。你享受智力挑战，讨厌低效与混乱，是天生的谋略家。偶尔会因过于追求完美而显得孤高，但正是这份‘淡泊明志，宁静致远’的气质，让你在关键时刻能做出影响深远的决策。" },
      { name: "亚里士多德", mbti: "INTP", desc: "荣格八维：Ti-Ne-Si-Fe。你像古希腊的哲人，以逻辑为刀，解剖世界的本质。Ti主导让你对概念精准度要求极高，Ne则让你不断联想、发散，提出‘为什么’和‘如果’。你享受纯粹的知识探索，不为功利，只为理解。你可能有些书卷气，说话喜欢引经据典（Si），但在人群中常显得抽离。你温和而好奇，像亚里士多德一样，试图为万物分类，建立自己的知识体系。你的内在世界丰富而有序，是典型的思想者。" },
      { name: "秦始皇", mbti: "ENTJ", desc: "荣格八维：Te-Ni-Se-Fi。你具有强大的执行力和战略野心，是天生的领袖。Te主导让你以结果为导向，高效组织资源，推动变革。Ni赋予你远见，能预见未来的格局。你像秦始皇一样，敢于打破旧秩序，建立新规则。自信、果断，甚至有些专制，但内心也有对认同的渴望（Fi）。你不怕孤独，因为你知道自己要征服的是什么。你追求的是宏大叙事，是‘统一’与‘秩序’的象征。" },

        }

      const E = scores.E || 0;
      const I = scores.I || 0;
      const S = scores.S || 0;

      const T = scores.T || 0;
      const F = scores.F || 0;
      const J = scores.J || 0;
      const P = scores.P || 0;
      const mbti = 
        (E >= I ? 'E' : 'I') +
        (S >= N ? 'S' : 'N') +
        (T >= F ? 'T' : 'F') +
        (J >= P ? 'J' : 'P');
      return mbti;
    }
